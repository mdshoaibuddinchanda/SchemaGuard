name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --extra dev --no-managed-python
      - run: uv run python -m ruff check .
      - run: uv run python -m mypy src/schemaguard
      - run: uv run python -m pytest -q -m "not network and not gpu and not foundation_model and not evidence"
      - run: uv run python scripts/generate_artifact_schemas.py
      - run: uv run python -m pytest -q tests/unit/test_artifact_schemas.py tests/unit/test_repository_naming.py
      - run: git diff --exit-code -- schemas
