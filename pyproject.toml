[project]
name = "schemaguard"
version = "0.1.0"
description = "Certified prediction consistency under lossless tabular schema migrations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "pyarrow>=16,<26",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0.2,<7",
  "httpx>=0.27,<1",
  "liac-arff>=2.5,<3",
  "scikit-learn>=1.5,<2",
  "filelock>=3.15,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "hypothesis>=6.100,<7",
  "ruff>=0.8,<1",
  "mypy>=1.10,<2",
]
models-cpu = [
  "scikit-learn==1.9.1",
  "catboost==1.2.10",
  "xgboost==3.4.1",
]
models-foundation = [
    "tabpfn==8.5.0",
    "tabicl==2.2.0",
    "torch==2.6.0",
]
monitoring = [
  "psutil>=7,<8",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "hypothesis>=6.100,<7",
  "ruff>=0.8,<1",
  "mypy>=1.10,<2",
]

[tool.pytest.ini_options]
addopts = "-q -m 'not network'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "network: tests that access the OpenML network",
  "gpu: tests that require CUDA or GPU telemetry",
  "foundation_model: tests that import or execute TabPFN or TabICL",
  "slow: tests that may exceed normal unit-test duration",
  "integration: end-to-end integration tests",
  "evidence: tests that read locally retained generated evidence",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/audit_data_foundation.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemaguard"]
