project: schemaguard
benchmark: SchemaOrbit-14

models:
  - id: LR-1.9
    name: sklearn.linear_model.LogisticRegression
    package: scikit-learn
    version: "1.9.1"
    role: Linear sanity baseline
    checkpoint: null
    preprocessing: common_onehot_standard
    parameters:
      penalty: l2
      C: 1.0
      solver: lbfgs
      max_iter: 2000
      tol: 1.0e-6
      class_weight: null
  - id: CAT-1.2
    name: catboost.CatBoostClassifier
    package: catboost
    version: "1.2.10"
    role: Native categorical boosted-tree model
    checkpoint: null
    preprocessing: native_catboost
    parameters:
      iterations: 500
      depth: 6
      learning_rate: 0.05
      l2_leaf_reg: 3.0
      random_strength: 0.0
      bootstrap_type: No
      loss_function: auto
      task_type: CPU
      thread_count: 2
      verbose: false
      allow_writing_files: false
  - id: XGB-3.4
    name: xgboost.XGBClassifier
    package: xgboost
    version: "3.4.1"
    role: Numeric/encoded boosted-tree model
    checkpoint: null
    preprocessing: common_onehot_no_scaling
    parameters:
      n_estimators: 500
      max_depth: 6
      learning_rate: 0.05
      min_child_weight: 1
      subsample: 1.0
      colsample_bytree: 1.0
      reg_lambda: 1.0
      reg_alpha: 0.0
      tree_method: hist
      n_jobs: 2
      verbosity: 0
  - id: TPFN3-8.5
    name: tabpfn.TabPFNClassifier
    package: tabpfn
    version: "8.5.0"
    role: TabPFN-3 foundation model
    checkpoint: tabpfn-v3-classifier-v3_default.ckpt
    preprocessing: native_tabpfn
    parameters:
      n_estimators: 8
      auto_scale_n_estimators: false
      fit_mode: low_memory
      memory_saving_mode: true
      n_preprocessing_jobs: 1
      inference_precision: auto
      ignore_pretraining_limits: false
      show_progress_bar: false
  - id: TICL2-2.2
    name: tabicl.TabICLClassifier
    package: tabicl
    version: "2.2.0"
    role: TabICLv2 foundation model
    checkpoint: tabicl-classifier-v2-20260212.ckpt
    preprocessing: native_tabicl
    parameters:
      n_estimators: 8
      batch_size: 1
      kv_cache: false
      offload_mode: auto
      use_amp: auto
      feat_shuffle_method: latin
      class_shuffle_method: shift
      average_logits: true
      n_jobs: 2

datasets:
  - {id: 3, name: kr-vs-kp, rows: 3196, features: 36, task: Binary, schema_property: Predominantly categorical}
  - {id: 23, name: cmc, rows: 1473, features: 9, task: Multiclass, schema_property: Mixed categorical/numerical}
  - {id: 29, name: credit-approval, rows: 690, features: 15, task: Binary, schema_property: Mixed and missing values}
  - {id: 31, name: credit-g, rows: 1000, features: 20, task: Binary, schema_property: Mixed financial schema}
  - {id: 36, name: segment, rows: 2310, features: 19, task: 7-class, schema_property: Numerical multiclass}
  - {id: 37, name: diabetes, rows: 768, features: 8, task: Binary, schema_property: Small numerical}
  - {id: 38, name: sick, rows: 3772, features: 29, task: Binary, schema_property: Mixed and imbalanced}
  - {id: 44, name: spambase, rows: 4601, features: 57, task: Binary, schema_property: Continuous numerical}
  - {id: 46, name: splice, rows: 3190, features: 60, task: 3-class, schema_property: High-cardinality categorical sequence}
  - {id: 50, name: tic-tac-toe, rows: 958, features: 9, task: Binary, schema_property: Entirely categorical}
  - {id: 54, name: vehicle, rows: 846, features: 18, task: 4-class, schema_property: Numerical multiclass}
  - {id: 1067, name: kc1, rows: 2109, features: 21, task: Binary, schema_property: Numerical and imbalanced}
  - {id: 1464, name: blood-transfusion-service-center, rows: 748, features: 4, task: Binary, schema_property: Small numerical}
  - {id: 1489, name: phoneme, rows: 5404, features: 5, task: Binary, schema_property: Medium numerical}

views:
  - {id: V00, name: identity, operation: Original schema}
  - {id: V01, name: numeric_affine_units, operation: x'=a*x+b}
  - {id: V02, name: numeric_asinh, operation: x'=asinh(x/s)}
  - {id: V03, name: category_permutation, operation: Reversible categorical code mapping}
  - {id: V04, name: categorical_onehot, operation: Reversible one-hot expansion}
  - {id: V05, name: duplicate_feature, operation: Add an exact duplicate}
  - {id: V06, name: redundant_affine_feature, operation: Add z=3*x+7}
  - {id: V07, name: integer_quotient_remainder, operation: "Replace x by q,r"}
  - {id: V08, name: column_permutation_control, operation: Reorder columns}
  - {id: V09, name: row_permutation_control, operation: Reorder training rows}
  - {id: V10, name: composite_migration, operation: "Compose V01, V03, and V08"}

pilot_datasets: [31, 36, 38, 44, 50, 1489]
main_datasets: [3, 23, 29, 31, 36, 37, 38, 44, 46, 50, 54, 1067, 1464, 1489]
pilot_seeds: [1729, 2718, 31415]
main_seeds: [1729, 2718, 31415, 57721, 161803]
smoke_dataset: 1464

split:
  train: 0.60
  calibration: 0.20
  test: 0.20
  method: stratified_group
  group_by: predictors
  group_folds: 5
  minimum_class_count_per_partition: 5

constraints:
  min_rows: 500
  max_rows: 6000
  min_features: 4
  max_features: 100
  min_classes: 2
  max_classes: 10
  require_default_target: true
  require_public_access: true
  require_stable_checksum: true
